<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sniper Journal · drie stijlrichtingen</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #08090a;
        color: #e8e6e1;
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      .intro { max-width: 1320px; margin: 0 auto; padding: 28px 20px 8px; }
      .intro h1 { margin: 0 0 6px; font-size: 1.5rem; letter-spacing: -0.02em; }
      .intro p { margin: 0; color: #8d919b; max-width: 70ch; }
      .rooster {
        max-width: 1320px; margin: 0 auto; padding: 20px;
        display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; align-items: start;
      }
      @media (max-width: 1080px) { .rooster { grid-template-columns: 1fr; max-width: 460px; } }
      .kolom > h2 { margin: 0 0 2px; font-size: 1.1rem; }
      .kolom > p { margin: 0 0 12px; color: #8d919b; font-size: 0.9rem; min-height: 4.2em; }

      /* ---------- Stijlsysteem: elke richting vult dezelfde tokens in ---------- */
      .t {
        --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;
        background: var(--bg); color: var(--tekst);
        border: 1px solid var(--rand); border-radius: 22px; overflow: hidden;
        font-size: var(--basis);
      }
      .t-a {
        --bg: #0a0b0d; --vlak: #101216; --vlak2: #171a1f; --rand: #22252b; --rand2: #33373f;
        --tekst: #ecebe7; --zacht: #8b8f99; --goud: #d9ad4a; --op-goud: #14110a; --goud-zacht: rgba(217,173,74,.12);
        --groen: #4cc38a; --groen-zacht: rgba(76,195,138,.13); --rood: #e5736a; --rood-zacht: rgba(229,115,106,.14);
        --oranje: #e0a04a; --oranje-zacht: rgba(224,160,74,.16); --grijs: #a3a8b3;
        --r: 8px; --r-klein: 6px; --basis: 14px; --kop: 1.45rem; --getal: 1.5rem; --ruimte: 14px; --lijn: 1px;
        --kop-gewicht: 600; --schaduw: none;
      }
      .t-b {
        --bg: #14120f; --vlak: #1d1a16; --vlak2: #27231d; --rand: #2f2a23; --rand2: #453e33;
        --tekst: #f3efe6; --zacht: #a39b8c; --goud: #e3b558; --op-goud: #1b1407; --goud-zacht: rgba(227,181,88,.14);
        --groen: #6fcf97; --groen-zacht: rgba(111,207,151,.14); --rood: #ee8273; --rood-zacht: rgba(238,130,115,.15);
        --oranje: #eaa955; --oranje-zacht: rgba(234,169,85,.18); --grijs: #b5ad9e;
        --r: 20px; --r-klein: 14px; --basis: 15.5px; --kop: 1.75rem; --getal: 1.9rem; --ruimte: 18px; --lijn: 1px;
        --kop-gewicht: 700; --schaduw: 0 10px 30px rgba(0,0,0,.35);
      }
      .t-c {
        --bg: #f4f1ea; --vlak: #fffdf8; --vlak2: #f0ece2; --rand: #e0dacb; --rand2: #c9c1ae;
        --tekst: #1c1a16; --zacht: #6a6558; --goud: #8a6410; --op-goud: #fffdf8; --goud-zacht: rgba(138,100,16,.10);
        --groen: #1f7a4d; --groen-zacht: rgba(31,122,77,.10); --rood: #b23a2c; --rood-zacht: rgba(178,58,44,.10);
        --oranje: #a35f0b; --oranje-zacht: rgba(163,95,11,.14); --grijs: #6a6558;
        --r: 12px; --r-klein: 8px; --basis: 15px; --kop: 1.6rem; --getal: 1.7rem; --ruimte: 16px; --lijn: 1px;
        --kop-gewicht: 650; --schaduw: 0 1px 2px rgba(28,26,22,.06);
      }

      .t .scherm { padding: 18px var(--ruimte) 0; display: flex; flex-direction: column; gap: var(--ruimte); }
      .t .boven { font-size: .72em; letter-spacing: .08em; text-transform: uppercase; color: var(--zacht); font-weight: 600; }
      .t h3 { margin: 0; font-size: var(--kop); letter-spacing: -0.02em; font-weight: var(--kop-gewicht); line-height: 1.15; }
      .t .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
      .t .zacht { color: var(--zacht); }
      .t .kaart {
        background: var(--vlak); border: var(--lijn) solid var(--rand); border-radius: var(--r);
        padding: var(--ruimte); box-shadow: var(--schaduw);
      }
      .t .feiten { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .t .feit { display: flex; flex-direction: column; gap: 2px; }
      .t .feit b { font-size: var(--getal); line-height: 1.1; font-weight: 650; }
      .t .feit .rij { display: flex; align-items: center; gap: 6px; font-weight: 600; }

      /* Tijdlijn */
      .t .tijdlijn { display: flex; flex-direction: column; gap: 10px; }
      .t .tl-kop { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
      .t .tl-kop strong { font-size: 1.02em; }
      .t .baan { position: relative; height: 92px; margin-top: 16px; }
      .t .sessie { position: absolute; height: 22px; border-radius: 999px; display: flex; align-items: center; padding: 0 10px;
        font-size: .78em; font-weight: 600; white-space: nowrap; }
      .t .sessie.l { top: 6px; left: 12.5%; width: 56.25%; background: var(--goud-zacht); color: var(--goud); border: 1px solid var(--goud); }
      .t .sessie.n { top: 34px; left: 43.75%; width: 56.25%; background: var(--vlak2); color: var(--zacht); border: 1px solid var(--rand2); }
      .t .zone { position: absolute; top: 0; bottom: 18px; border-radius: 4px; }
      .t .zone.rood { left: 43.75%; width: 6.25%; background: var(--rood-zacht); border-left: 2px solid var(--rood); border-right: 2px solid var(--rood); }
      .t .zone.oranje { left: 54.7%; width: 3.1%; background: var(--oranje-zacht); border-left: 2px dashed var(--oranje); border-right: 2px dashed var(--oranje); }
      .t .nu { position: absolute; top: -4px; bottom: 14px; left: 22.9%; width: 2px; background: var(--tekst); }
      .t .nu::after { content: 'nu 10:40'; position: absolute; top: -16px; left: -2px; font-size: .7em; font-family: var(--mono);
        background: var(--tekst); color: var(--bg); padding: 1px 5px; border-radius: 4px; white-space: nowrap; }
      .t .uren { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between;
        font-family: var(--mono); font-size: .68em; color: var(--zacht); border-top: 1px solid var(--rand); padding-top: 3px; }
      .t .nieuws { display: flex; flex-direction: column; gap: 6px; font-size: .9em; }
      .t .nieuws div { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

      /* Statuslabels: kleur + icoon + woord */
      .t .chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px 2px 7px; border-radius: 999px;
        font-size: .78em; font-weight: 650; white-space: nowrap; }
      .t .chip svg, .t .knop svg, .t .nr svg, .t .feit svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8;
        stroke-linecap: round; stroke-linejoin: round; flex: none; }
      .t .chip.goed { color: var(--groen); background: var(--groen-zacht); }
      .t .chip.fout { color: var(--rood); background: var(--rood-zacht); }
      .t .chip.wacht { color: var(--grijs); background: var(--vlak2); }
      .t .chip.slot { color: var(--goud); background: var(--goud-zacht); }
      .t .chip.oranje { color: var(--oranje); background: var(--oranje-zacht); }

      /* Stappen */
      .t .stappen { display: flex; flex-direction: column; gap: 8px; }
      .t .stap { border: var(--lijn) solid var(--rand); border-radius: var(--r); background: var(--vlak); box-shadow: var(--schaduw); }
      .t .stap.nu-stap { border-color: var(--goud); }
      .t .stap.dicht { opacity: .5; box-shadow: none; }
      .t .stap-kop { display: flex; align-items: center; gap: 12px; padding: 12px var(--ruimte); }
      .t .nr { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none;
        border: 1px solid var(--rand2); color: var(--zacht); font-family: var(--mono); font-size: .82em; font-weight: 600; }
      .t .nu-stap .nr { background: var(--goud); border-color: var(--goud); color: var(--op-goud); }
      .t .stap-kop b { display: block; font-size: 1.05em; }
      .t .stap-kop span { font-size: .88em; color: var(--zacht); }
      .t .stap-lijf { padding: 0 var(--ruimte) var(--ruimte); display: flex; flex-direction: column; gap: 10px; }
      .t .knop { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px;
        border-radius: var(--r-klein); border: 1px solid var(--goud); background: var(--goud); color: var(--op-goud);
        font: inherit; font-weight: 650; font-size: 1.02em; }
      .t .knop.tweede { background: transparent; color: var(--tekst); border-color: var(--rand2); min-height: 44px; font-weight: 500; font-size: .95em; }

      /* Meters met het getal erin */
      .t .meters { display: flex; flex-direction: column; gap: 10px; }
      .t .meter { position: relative; height: 40px; border-radius: var(--r-klein); background: var(--vlak2); overflow: hidden;
        border: 1px solid var(--rand); }
      .t .meter i { position: absolute; inset: 0 auto 0 0; background: var(--goud-zacht); border-right: 2px solid var(--goud); }
      .t .meter.groen i { background: var(--groen-zacht); border-right-color: var(--groen); }
      .t .meter span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: .9em; }
      .t .meter span b { font-family: var(--mono); font-variant-numeric: tabular-nums; }

      .t .menu { display: flex; justify-content: space-around; border-top: 1px solid var(--rand); margin-top: var(--ruimte);
        padding: 8px 4px 12px; font-size: .7em; color: var(--zacht); background: var(--vlak); }
      .t .menu span { display: flex; flex-direction: column; align-items: center; gap: 3px; }
      .t .menu span:first-child { color: var(--tekst); }
      .t .menu svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .t .menu span:first-child svg { color: var(--goud); }

      /* Het systeem zelf */
      .t .systeem { border-top: 1px solid var(--rand); padding: var(--ruimte); display: flex; flex-direction: column; gap: 10px; background: var(--vlak); }
      .t .staal { display: flex; gap: 6px; flex-wrap: wrap; }
      .t .staal i { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--rand2); }
      .t .chips { display: flex; gap: 6px; flex-wrap: wrap; }
      .t .schaal { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <div class="intro">
      <h1>Drie stijlrichtingen voor het startscherm</h1>
      <p>
        Dezelfde dag, drie keer anders. Elke richting gebruikt hetzelfde stijlsysteem: dezelfde onderdelen en
        dezelfde statuskleuren, met andere waarden voor kleur, lettergrootte, marge en hoekronding. De gegevens zijn
        voorbeelden.
      </p>
    </div>
    <div class="rooster" id="rooster"></div>

    <script>
      const ico = {
        vink: 'M5 12.5l4.5 4.5L19 7.5', kruis: 'M6 6l12 12M18 6L6 18', klok: 'M12 7v5l3 2M12 3a9 9 0 100 18 9 9 0 000-18z',
        slot: 'M7 11V8a5 5 0 0110 0v3M6 11h12v9H6z', min: 'M6 12h12', op: 'M12 16V5M7 10l5-5 5 5M5 20h14',
        dag: 'M4 9h16M7 3v4M17 3v4M5 5h14v15H5z', lijst: 'M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01',
        boek: 'M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3zM5 17a3 3 0 013-3h11', wiel: 'M12 9a3 3 0 100 6 3 3 0 000-6zM4 12h2M18 12h2M12 4v2M12 18v2',
      }
      const i = (n) => `<svg viewBox="0 0 24 24"><path d="${ico[n]}"/></svg>`
      const chip = (soort, icoon, tekst) => `<span class="chip ${soort}">${i(icoon)}${tekst}</span>`

      const scherm = () => `
        <div class="scherm">
          <div>
            <div class="boven">Vandaag</div>
            <h3>Maandag 16 november</h3>
          </div>

          <div class="kaart tijdlijn">
            <div class="tl-kop"><strong>Londen is open</strong><span class="zacht mono">New York over 3:20</span></div>
            <div class="baan">
              <div class="zone rood"></div>
              <div class="zone oranje"></div>
              <div class="sessie l">Londen 09:00–18:00</div>
              <div class="sessie n">New York 14:00–23:00</div>
              <div class="nu"></div>
              <div class="uren"><span>07</span><span>09</span><span>11</span><span>13</span><span>15</span><span>17</span><span>19</span><span>21</span><span>23</span></div>
            </div>
            <div class="nieuws">
              <div>${chip('fout', 'kruis', 'Niet traden')}<span class="mono">14:00–15:00</span><span class="zacht">Inflatiecijfer VS om 14:30</span></div>
              <div>${chip('oranje', 'klok', 'Uitkijken')}<span class="mono">15:45–16:15</span><span class="zacht">Toespraak centrale bank</span></div>
            </div>
          </div>

          <div class="feiten">
            <div class="kaart feit"><span class="boven">Streak</span><b class="mono">4</b><span class="zacht">dagen volgens de regels</span></div>
            <div class="kaart feit"><span class="boven">Trade vandaag</span><span class="rij">${i('min')}Nog niet</span><span class="zacht">één trade per dag</span></div>
          </div>

          <div class="stappen">
            <div class="stap nu-stap">
              <div class="stap-kop"><span class="nr">1</span><div><b>Analyse</b><span>Nu aan de beurt</span></div></div>
              <div class="stap-lijf">
                <button class="knop">${i('op')}Screenshot uploaden</button>
                <button class="knop tweede">Vandaag geen setup</button>
              </div>
            </div>
            <div class="stap dicht"><div class="stap-kop"><span class="nr">${i('slot')}</span><div><b>Check</b><span>Op slot</span></div></div></div>
            <div class="stap dicht"><div class="stap-kop"><span class="nr">${i('slot')}</span><div><b>Besluit</b><span>Op slot</span></div></div></div>
            <div class="stap dicht"><div class="stap-kop"><span class="nr">${i('slot')}</span><div><b>Resultaat</b><span>Op slot</span></div></div></div>
          </div>

          <div class="kaart meters">
            <span class="boven">FTMO-voortgang</span>
            <div class="meter"><i style="width:32%"></i><span>Winstdoel <b>3,2% van 10%</b></span></div>
            <div class="meter groen"><i style="width:84%"></i><span>Buffer <b>$8.400 van $10.000</b></span></div>
          </div>
        </div>
        <div class="menu">
          <span>${i('dag')}Vandaag</span><span>${i('lijst')}Geschiedenis</span><span>${i('boek')}Playbook</span><span>${i('wiel')}Instellingen</span>
        </div>
        <div class="systeem">
          <span class="boven">Stijlsysteem</span>
          <div class="staal">
            <i style="background:var(--bg)"></i><i style="background:var(--vlak)"></i><i style="background:var(--vlak2)"></i>
            <i style="background:var(--tekst)"></i><i style="background:var(--zacht)"></i><i style="background:var(--goud)"></i>
            <i style="background:var(--groen)"></i><i style="background:var(--rood)"></i><i style="background:var(--oranje)"></i>
          </div>
          <div class="chips">
            ${chip('goed', 'vink', 'Goedgekeurd')}${chip('fout', 'kruis', 'Afgekeurd')}${chip('wacht', 'klok', 'Wachtend')}${chip('slot', 'slot', 'Op slot')}
          </div>
          <div class="schaal">
            <span style="font-size:var(--kop);font-weight:var(--kop-gewicht);letter-spacing:-.02em">Kop</span>
            <span>Tekst</span><span class="zacht" style="font-size:.88em">Klein</span>
            <span class="mono" style="font-size:var(--getal);font-weight:650">2,50</span><span class="mono">4.000,00</span>
          </div>
        </div>`

      const richtingen = [
        ['a', 'A · Terminal', 'Strak en compact, zoals een professioneel handelsscherm. Dunne lijnen, kleine hoeken, veel informatie op één scherm. Goud alleen als dunne accentlijn en voor de hoofdknop.'],
        ['b', 'B · Kluis', 'Warm donker met ruime kaarten en grote, ronde vormen. Grotere letters en cijfers, meer lucht. Rustigst op je telefoon, maar je scrolt meer.'],
        ['c', 'C · Papier', 'Licht en warm, als een papieren journal. Het best leesbaar bij daglicht. Het goud is donkerder gemaakt voor voldoende contrast.'],
      ]
      document.getElementById('rooster').innerHTML = richtingen
        .map(([k, naam, uitleg]) => `<section class="kolom"><h2>${naam}</h2><p>${uitleg}</p><div class="t t-${k}">${scherm()}</div></section>`)
        .join('')
    </script>
  </body>
</html>
